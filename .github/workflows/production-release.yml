# Deploys production on pushes to `master` (e.g. a manual hotfix commit) or via
# workflow_dispatch. The routine 8-hourly production refresh is driven by
# auto-rebase-deploy.yml, which promotes the validated staging commit to master
# and deploys it directly; that promotion does not re-trigger this workflow
# (GITHUB_TOKEN ref updates don't trigger workflows), so there is no double deploy.
name: Production Release
concurrency: production-release
on:
    push:
        branches:
            - master
    workflow_dispatch:

jobs:
    deploy:
        uses: ./.github/workflows/deploy.yml
        with:
            environment: production
            hostname: cloud-instances.info
        secrets: inherit
