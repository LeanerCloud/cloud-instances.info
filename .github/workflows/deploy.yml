# Reusable build + deploy workflow.
# Builds the site (Go scrapers + Next.js, re-scraping fresh pricing each run),
# uploads assets to the environment's Cloudflare R2 bucket, deploys the worker,
# purges the cache, and notifies Slack. Called by the staging/production wrappers
# and by the auto-rebase orchestrator.
name: Deploy

on:
    workflow_call:
        inputs:
            environment:
                description: "staging or production"
                required: true
                type: string
            hostname:
                description: "Public hostname for this environment"
                required: true
                type: string
            deny_robots:
                description: "Set robots.txt to disallow (staging only)"
                required: false
                default: false
                type: boolean
            ref:
                description: "Git ref/SHA to build and deploy (defaults to the triggering commit)"
                required: false
                default: ""
                type: string

jobs:
    deploy:
        name: Build and deploy to ${{ inputs.environment }}
        runs-on: ubuntu-22.04-arm
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.ref }}

            - uses: actions/setup-go@v5
              with:
                  go-version: 1.24.4

            - name: Build site with scrapers
              run: make all
              env:
                  # AWS credentials for EC2/RDS/ElastiCache/OpenSearch/Redshift pricing
                  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  # Azure credentials for VM pricing (service principal)
                  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
                  AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
                  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
                  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
                  # GCP API key for Compute Engine pricing (fork scraper)
                  GCP_API_KEY: ${{ secrets.GCP_API_KEY }}
                  # GCP service account for Compute Engine pricing (upstream scraper)
                  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
                  GCP_CLIENT_EMAIL: ${{ secrets.GCP_CLIENT_EMAIL }}
                  GCP_PRIVATE_KEY: ${{ secrets.GCP_PRIVATE_KEY }}
                  # Next.js configuration
                  NEXT_PUBLIC_URL: https://${{ inputs.hostname }}/
                  # Hide the sponsor marquee banner (sponsors live on /sponsors)
                  NEXT_PUBLIC_REMOVE_ADVERTS: "1"
                  DENY_ROBOTS_TXT: ${{ inputs.deny_robots && '1' || '' }}
                  # Error monitoring
                  NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
                  SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
                  SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
                  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
                  # Analytics
                  NEXT_PUBLIC_GOOGLE_TAG_MANAGER_ID: ${{ secrets.GOOGLE_TAG_MANAGER_ID }}
                  NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${{ secrets.UMAMI_WEBSITE_ID }}
                  NEXT_PUBLIC_UMAMI_SCRIPT_URL: ${{ secrets.UMAMI_SCRIPT_URL }}
                  # Scraper notifications (optional)
                  SLACK_WEBHOOK_URL: ${{ secrets.SCRAPER_SLACK_WEBHOOK_URL }}

            - name: Deploy assets to the ${{ inputs.environment }} bucket
              run: cd deployment && npm ci && npm run start
              env:
                  DEPLOYMENT_CF_BUCKET: ${{ inputs.environment == 'staging' && secrets.STAGING_CF_BUCKET || secrets.PRODUCTION_CF_BUCKET }}
                  DEPLOYMENT_CF_ACCOUNT_ID: ${{ secrets.DEPLOYMENT_CF_ACCOUNT_ID }}
                  DEPLOYMENT_CF_AWS_ACCESS_KEY_ID: ${{ inputs.environment == 'staging' && secrets.STAGING_CF_AWS_ACCESS_KEY_ID || secrets.PRODUCTION_CF_AWS_ACCESS_KEY_ID }}
                  DEPLOYMENT_CF_AWS_SECRET_ACCESS_KEY: ${{ inputs.environment == 'staging' && secrets.STAGING_CF_AWS_SECRET_ACCESS_KEY || secrets.PRODUCTION_CF_AWS_SECRET_ACCESS_KEY }}
                  DEPLOYMENT_CF_API_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  DEPLOYMENT_CF_NAMESPACE: ${{ inputs.environment == 'staging' && secrets.STAGING_CF_NAMESPACE || secrets.PRODUCTION_CF_NAMESPACE }}

            - uses: cloudflare/wrangler-action@v3
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  environment: ${{ inputs.environment }}
                  wranglerVersion: "4.15.0"

            - name: Clear Cloudflare cache
              run: |
                  curl -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/purge_cache" \
                  -H "Authorization: Bearer ${CF_API_TOKEN}" \
                  -H "Content-Type: application/json" \
                  --data "{\"hosts\":[\"${HOSTNAME}\"]}"
              env:
                  ZONE_ID: ${{ inputs.environment == 'staging' && secrets.STAGING_CF_ZONE_ID || secrets.PRODUCTION_CF_ZONE_ID }}
                  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  HOSTNAME: ${{ inputs.hostname }}

            - name: Success Slack Notify
              if: success()
              uses: slackapi/slack-github-action@v1.16.0
              continue-on-error: true
              with:
                  payload: '{"blocks":[{"type":"section","text":{"type":"mrkdwn","text":":rocket: *${{ inputs.hostname }}* (${{ inputs.environment }}) deployed. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}}]}'
              env:
                  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
                  SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

            - name: Failure Slack Notify
              if: failure()
              uses: slackapi/slack-github-action@v1.16.0
              continue-on-error: true
              with:
                  payload: '{"blocks":[{"type":"section","text":{"type":"mrkdwn","text":":x: *${{ inputs.hostname }}* (${{ inputs.environment }}) deployment failed. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}}]}'
              env:
                  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
                  SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
