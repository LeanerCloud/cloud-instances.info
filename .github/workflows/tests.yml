name: Tests
on: [push, pull_request]

jobs:
    gofmt:
        name: gofmt
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version: 1.26.0
            - name: Check gofmt
              run: cd scraper && gofmt -l . && test -z "$(gofmt -l .)"

    go-tests:
        name: Go build, vet and tests (scraper)
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v2
            - uses: actions/setup-go@v5
              with:
                  go-version: 1.26.0
            - name: Build, vet and test the scraper
              run: cd scraper && go build ./... && go vet ./... && go test ./...

    prettier:
        name: Prettier
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v4
            - uses: actions/cache@v4
              with:
                  path: ~/.npm
                  key: ${{ runner.os }}-npm-prettier
                  restore-keys: |
                      ${{ runner.os }}-npm-
            - run: npm install -g prettier@3.5.3
            - run: prettier --check .

    tests:
        name: Check Types and Run Tests
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v4
            - name: Fetch pre-built www data for tests
              # Download to a file (don't pipe into tar), then extract ONLY the
              # www/ member with --no-same-owner. Limiting extraction to www/
              # means a compromised artifact can't drop files elsewhere in the
              # workspace (e.g. a malicious package.json/postinstall the next
              # npm ci would run). SHA-pinning isn't possible here: the tarball
              # is rebuilt with fresh pricing on every deploy.
              run: |
                  curl -fsSL -o www_pre_build.tar.gz https://instances.vantagestaging.sh/www_pre_build.tar.gz
                  tar -xzf www_pre_build.tar.gz --no-same-owner www
                  rm -f www_pre_build.tar.gz
            - uses: actions/setup-node@v4
              with:
                  node-version-file: next/.nvmrc
            - name: Initialize the test environment
              run: cd next && npm ci && npm run init
            - name: Check types
              run: cd next && npm run check-types
            - name: Run unit tests
              run: cd next && npm run test -- --coverage
