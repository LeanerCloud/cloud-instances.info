# Deploys staging on direct pushes to the bot-managed `staging-auto` branch, or
# manually via workflow_dispatch. The 8-hourly automated path is driven by
# auto-rebase-deploy.yml (which calls deploy.yml directly).
name: Staging Release
concurrency: staging-release
on:
    push:
        branches:
            - staging-auto
    workflow_dispatch:

jobs:
    deploy:
        uses: ./.github/workflows/deploy.yml
        with:
            environment: staging
            hostname: staging-cloud-instances.uk
            deny_robots: true
        secrets: inherit
